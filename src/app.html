<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Color mode before the first paint: the user's saved choice, otherwise the OS setting.
			// Same rules as src/lib/theme.ts — keep both in sync.
			(function () {
				var theme;
				try {
					theme = localStorage.getItem('runhappy-theme');
				} catch (e) {}
				if (theme !== 'light' && theme !== 'dark') {
					theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.dataset.theme = theme;
				// Report Card intro already closed in this tab: keep it hidden (same key as src/lib/intro.ts).
				try {
					if (sessionStorage.getItem('runhappy-intro-seen') !== null) {
						document.documentElement.dataset.introSeen = '';
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
